name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Build universal ZIP
        run: ./scripts/package.sh
      - name: Sign update archive and feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          ./scripts/appcast.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/appcast.xml
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Run tests
        run: ./scripts/test.sh
      - name: Check downloaded package
        run: |
          (cd dist && shasum -a 256 -c ./*.sha256)
          ./scripts/check-package.sh dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download the universal ZIP below for Apple Silicon and Intel Macs running macOS 13 or later. Xcode and Swift are not required.

          Extract the ZIP, move **Chrome Profile Router.app** to Applications, and open it. The management window shows the installed version and buttons to check for updates or open your settings. Configure your Chrome profiles before choosing the app as your default browser.

          Starting with 1.0.5, the app checks for updates about once a day while in use and asks before installing. You can also choose **Check for Updates…** (**更新を確認…**) in the management window. Versions 1.0.4 and earlier need one manual replacement to enable this feature.

          Starting with 1.0.7, the interface supports English and Japanese and follows your macOS language preferences. To choose a language for this app, use **System Settings → General → Language & Region → Applications**, then restart the app.

          This build uses ad-hoc signing and is not notarized by Apple. If macOS blocks the first launch, use **System Settings → Privacy & Security → Open Anyway** after attempting to open it, only if you trust this download. See [Apple's instructions](https://support.apple.com/en-us/102445).

          Existing user settings are preserved when updating.
          NOTES
          test -s dist/appcast.xml
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
